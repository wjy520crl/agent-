<!DOCTYPE html>
<html lang="zh-CN" style="color-scheme: dark;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多Agent架构测试表单</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Lora:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --dark: #141413;
            --light: #faf9f5;
            --mid-gray: #b0aea5;
            --light-gray: #e8e6dc;
            --orange: #d97757;
            --blue: #6a9bcc;
            --green: #788c5d;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        body {
            font-family: 'Lora', Georgia, serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: var(--dark);
            color: var(--light);
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: 'Poppins', Arial, sans-serif;
            font-weight: 600;
        }

        .container {
            background-color: var(--dark);
            padding: 30px;
            border-radius: 12px;
            box-shadow: var(--shadow);
            border: 1px solid var(--mid-gray);
        }

        h1 {
            text-align: center;
            color: var(--light);
            margin-bottom: 1.5rem;
            background: linear-gradient(135deg, var(--light) 0%, var(--orange) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-weight: 500;
            color: var(--light);
        }

        input[type="text"], textarea, select {
            padding: 12px;
            background: var(--dark);
            border: 1px solid var(--mid-gray);
            border-radius: 8px;
            font-size: 16px;
            color: var(--light);
            font-family: inherit;
            transition: border-color 0.3s ease;
        }

        input[type="text"]:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--orange);
            box-shadow: 0 0 0 3px rgba(217, 119, 87, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 150px;
        }

        button {
            padding: 12px 20px;
            background-color: var(--orange);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s ease, transform 0.3s ease;
        }

        button:hover {
            background-color: #c76645;
            transform: translateY(-2px);
        }

        button:focus {
            outline: 2px solid #c76645;
            outline-offset: 2px;
        }

        .result {
            margin-top: 30px;
            padding: 20px;
            background-color: var(--dark);
            border-radius: 8px;
            border-left: 4px solid var(--orange);
            border: 1px solid var(--mid-gray);
        }

        .result h2 {
            margin-top: 0;
            color: var(--orange);
        }

        .result pre {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 6px;
            padding: 1rem;
            margin: 1rem 0;
            overflow-x: auto;
            border: 1px solid var(--mid-gray);
            color: var(--light);
        }

        .result code {
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>多Agent架构测试表单</h1>
        
        <form id="testForm">
            <div class="form-group">
                <label for="task">任务描述</label>
                <textarea id="task" name="task" placeholder="请输入您的任务描述..."></textarea>
            </div>
            
            <div class="form-group">
                <label for="agentType">Agent类型</label>
                <select id="agentType" name="agentType">
                    <option value="research">Research Agent (研究)</option>
                    <option value="code">Code Agent (代码)</option>
                    <option value="data">Data Agent (数据)</option>
                    <option value="writing">Writing Agent (写作)</option>
                    <option value="multi">Multi-Agent (多Agent协作)</option>
                </select>
            </div>
            
            <button type="submit">执行任务</button>
        </form>
        
        <div class="result" id="result" style="display: none;">
            <h2>执行结果</h2>
            <div id="resultContent"></div>
        </div>
    </div>
    
    <script>
        document.getElementById('testForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const task = document.getElementById('task').value;
            const agentType = document.getElementById('agentType').value;
            const resultDiv = document.getElementById('result');
            const resultContent = document.getElementById('resultContent');
            
            // 显示加载状态
            resultDiv.style.display = 'block';
            resultContent.innerHTML = '<p>正在执行任务，请稍候...</p>';
            
            // 模拟API调用
            setTimeout(function() {
                let result = '';
                
                switch(agentType) {
                    case 'research':
                        result = '这是Research Agent的执行结果。\n\n根据您的任务，我进行了详细的研究，发现了以下关键信息：\n1. 信息点一\n2. 信息点二\n3. 信息点三\n\n这些信息可以帮助您更好地理解问题。';
                        break;
                    case 'code':
                        result = '这是Code Agent的执行结果。\n\n```python\ndef hello_world():\n    print("Hello, World!")\n\nif __name__ == "__main__":\n    hello_world()\n```\n\n执行结果：\nHello, World!';
                        break;
                    case 'data':
                        result = '这是Data Agent的执行结果。\n\n数据分析结果：\n- 平均值：42.5\n- 最大值：100\n- 最小值：0\n- 标准差：15.2';
                        break;
                    case 'writing':
                        result = '这是Writing Agent的执行结果。\n\n# 任务执行报告\n\n根据您的需求，我撰写了这份报告。报告详细分析了任务的各个方面，包括背景、方法、结果和建议。\n\n## 背景\n\n任务的背景信息...\n\n## 方法\n\n执行任务的方法...\n\n## 结果\n\n任务执行的结果...\n\n## 建议\n\n基于结果的建议...';
                        break;
                    case 'multi':
                        result = '这是Multi-Agent协作的执行结果。\n\n### Research Agent 结果\n进行了详细的研究，收集了相关信息。\n\n### Code Agent 结果\n生成了相关代码并执行。\n\n### Data Agent 结果\n分析了相关数据。\n\n### Writing Agent 结果\n撰写了综合报告。\n\n## 综合结论\n通过多Agent的协作，成功完成了任务，提供了全面的解决方案。';
                        break;
                }
                
                resultContent.innerHTML = '<pre>' + result + '</pre>';
            }, 1500);
        });
    </script>
</body>
</html>
